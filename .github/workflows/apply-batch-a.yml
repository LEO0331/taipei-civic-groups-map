name: Apply Batch A
on:
  push:
    branches: [fix/batch-a-correctness]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply correctness changes
        run: node .github/patches/apply-batch-a.mjs
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit applied changes
        run: |
          rm -f .github/patches/apply-batch-a.mjs .github/workflows/apply-batch-a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: batch A correctness and error states"
          git push
