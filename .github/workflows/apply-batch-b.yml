name: Apply Batch B navigation fixes

on:
  push:
    branches: [fix/b-navigation-state]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Batch B changes
        run: node .github/patches/apply-batch-b.mjs
      - name: Stabilize dataset content scrolling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  const scrollToDatasetContent = (behavior: ScrollBehavior = 'smooth') => {\n    requestAnimationFrame(() => requestAnimationFrame(() => datasetContentRef.current?.scrollIntoView({ behavior, block: 'start' })));\n  };`;
          const after = `  const scrollToDatasetContent = (behavior: ScrollBehavior = 'smooth') => {\n    const align = (nextBehavior: ScrollBehavior) => {\n      const node = datasetContentRef.current;\n      if (!node) return;\n      const top = Math.max(0, node.getBoundingClientRect().top + window.scrollY - 16);\n      window.scrollTo({ top, behavior: nextBehavior });\n    };\n    requestAnimationFrame(() => requestAnimationFrame(() => align(behavior)));\n    window.setTimeout(() => align('auto'), 250);\n    window.setTimeout(() => align('auto'), 750);\n  };`;
          if (!source.includes(before)) throw new Error('Expected Batch B scroll helper was not generated');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Verify typecheck, unit tests, and production build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run dashboard end-to-end tests
        run: npm run test:e2e
      - name: Commit verified Batch B changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patches/apply-batch-b.mjs .github/workflows/apply-batch-b.yml
          git add src/App.tsx tests/e2e/navigation-state.spec.ts
          git commit -m "fix: complete Batch B navigation state and persistence"
          git push origin HEAD:fix/b-navigation-state
