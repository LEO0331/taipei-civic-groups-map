name: Complete Batch C UI consistency

on:
  push:
    branches: [fix/c-ui-consistency]

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize Batch C with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X theirs origin/main
      - name: Apply remaining Batch C changes
        run: node .github/patches/complete-batch-c.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify typecheck, unit tests, and production build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full end-to-end suite
        run: npm run test:e2e
      - name: Commit verified Batch C changes
        run: |
          git rm .github/patches/complete-batch-c.mjs .github/workflows/complete-batch-c.yml
          git add src/AdultInfluenzaVaccineProvidersModule.tsx src/DataTrustPanel.tsx src/InfluenzaVaccineProvidersChildren3PlusModule.tsx src/PhysicalTherapyClinicsModule.tsx src/HealthcareInstitutionDirectory.tsx src/lib/uiFamilies.ts tests/e2e/ui-consistency.spec.ts
          git commit -m "fix: complete Batch C UI family consistency"
          git push origin HEAD:fix/c-ui-consistency
