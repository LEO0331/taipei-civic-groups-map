name: Complete Batch D frontend architecture

on:
  push:
    branches: [fix/d-frontend-architecture]

permissions:
  contents: write

concurrency:
  group: complete-batch-d
  cancel-in-progress: true

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d-frontend-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Batch D changes
        run: node .github/patches/complete-batch-d.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Verify production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full end-to-end suite
        run: npm run test:e2e
      - name: Commit verified Batch D changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css src/lib/frontendArchitecture.test.ts tests/e2e/frontend-architecture.spec.ts .github/workflows/frontend-ci.yml
          if git diff --cached --quiet; then
            echo "No Batch D changes to commit"
          else
            git commit -m "refactor: complete Batch D frontend architecture"
            git push origin HEAD:fix/d-frontend-architecture
          fi
