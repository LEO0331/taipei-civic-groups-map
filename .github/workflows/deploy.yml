name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-prepare:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:schema:capture
      - run: npm run data:release:capture
      - run: npm run data:fetch
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
      - run: npm run data:schema:check
      - name: Upload source schema drift evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-schema-drift
          path: public/data/source-schema-report.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run data:release:changes
      - run: npm run data:quality:check
      - name: Upload data-quality anomaly evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-quality-anomaly
          path: public/data/data-quality-anomaly-report.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run data:convert
      - name: Pack converted release workspace
        run: tar --exclude=.git --exclude=node_modules --exclude=dist -czf "$RUNNER_TEMP/release-workspace.tgz" .
      - name: Upload converted release workspace
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-workspace
          path: ${{ runner.temp }}/release-workspace.tgz
          if-no-files-found: error
          retention-days: 1

  release-build:
    needs: release-prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-workspace
          path: ${{ runner.temp }}/release-workspace
      - name: Restore converted release workspace
        run: tar -xzf "$RUNNER_TEMP/release-workspace/release-workspace.tgz"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run performance:budget
      - name: Upload data release evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-release-evidence
          path: |
            public/data/data-trust-manifest.json
            public/data/data-release-summary.json
            public/data/conversion-report.json
            public/data/source-schema-report.json
            public/data/data-change-summary.json
            public/data/data-quality-anomaly-report.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  e2e-desktop:
    needs: release-prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-workspace
          path: ${{ runner.temp }}/release-workspace
      - name: Restore converted release workspace
        run: tar -xzf "$RUNNER_TEMP/release-workspace/release-workspace.tgz"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=desktop
      - name: Upload desktop Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-failures-desktop
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-mobile:
    needs: release-prepare
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-workspace
          path: ${{ runner.temp }}/release-workspace
      - name: Restore converted release workspace
        run: tar -xzf "$RUNNER_TEMP/release-workspace/release-workspace.tgz"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=mobile
      - name: Upload mobile Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-failures-mobile
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs:
      - release-build
      - e2e-desktop
      - e2e-mobile
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
