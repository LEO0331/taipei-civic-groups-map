name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:audit:senior-care-policy
      - run: npm run data:verify:senior-care-policy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run performance:budget

  e2e-desktop:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=desktop
      - name: Upload desktop Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-failures-desktop
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=mobile
      - name: Upload mobile Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-failures-mobile
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  policy-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify pinned official PDF extraction
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-pdf"
          "$RUNNER_TEMP/policy-pdf/bin/python" -m pip install --disable-pip-version-check -r scripts/senior-care-policy-requirements.txt
          "$RUNNER_TEMP/policy-pdf/bin/python" scripts/seniorCarePolicyPdf.test.py
          "$RUNNER_TEMP/policy-pdf/bin/python" scripts/seniorCarePolicyPdf.py
